[unity]
image=docker.io/library/ubuntu:22.04
init=true
additional_flags="--dns 8.8.8.8 --dns 1.1.1.1 --security-opt seccomp=unconfined"
pre_init_hooks="echo '[1/5] Installing dependencies...' && DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates gnupg libasound2 libpulse0 && echo '[1.5/5] Installing libssl1.1 compatibility layer...' && curl -fsSL -o /tmp/libssl1.1.deb http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb && dpkg -i /tmp/libssl1.1.deb && rm -f /tmp/libssl1.1.deb && echo '[2/5] Importing Unity GPG key...' && install -d /etc/apt/keyrings && curl -fsSL https://hub.unity3d.com/linux/keys/public | gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg && echo '[3/5] Adding Unity repository...' && echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main' > /etc/apt/sources.list.d/unityhub.list && echo '[4/5] Installing Unity Hub...' && DEBIAN_FRONTEND=noninteractive apt-get update && echo '[5/5] Verifying installation...' && command -v unityhub && unityhub --version 2>/dev/null || true"
additional_packages="unityhub fonts-noto-cjk"
exported_apps="unityhub"
post_init_hooks="rm -f /usr/bin/xdg-open && ln -sf /usr/bin/distrobox-host-exec /usr/bin/xdg-open"
