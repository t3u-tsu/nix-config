[unity]
image=docker.io/library/ubuntu:22.04
init=true
pre_init_hooks="echo '[1/5] Installing dependencies...' && DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates gnupg libasound2 libpulse0"
pre_init_hooks="echo '[2/5] Importing Unity GPG key...' && install -d /etc/apt/keyrings && curl -fsSL https://hub.unity3d.com/linux/keys/public | gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg"
pre_init_hooks="echo '[3/5] Adding Unity repository...' && echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main' > /etc/apt/sources.list.d/unityhub.list"
pre_init_hooks="echo '[4/5] Installing Unity Hub...' && DEBIAN_FRONTEND=noninteractive apt-get update"
pre_init_hooks="echo '[5/5] Verifying installation...' && command -v unityhub && unityhub --version 2>/dev/null || true"
additional_packages="unityhub fonts-noto-cjk"
exported_apps="unityhub"
post_init_hooks="rm -f /usr/bin/xdg-open && ln -sf /usr/bin/distrobox-host-exec /usr/bin/xdg-open"
