name: Nix Flake Check

on:
  push:
    branches: [ "main", "feat/*", "fix/*", "refactor/*", "docs/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: cachix/cachix-action@master
        with:
          name: niri
          skipPush: true

      # The flake pulls in the private nix-config-private repository, so every
      # evaluation needs this read-only deploy key. Fork pull requests receive no
      # secrets and will fail here.
      - name: Deploy key for the private flake input
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.NIX_CONFIG_PRIVATE_DEPLOY_KEY }}" > ~/.ssh/nix-config-private
          chmod 600 ~/.ssh/nix-config-private
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCONF'
          Host github-nix-config-private
            HostName github.com
            User git
            IdentityFile ~/.ssh/nix-config-private
            IdentitiesOnly yes
          SSHCONF

      - name: Check Nix Flake
        run: nix flake check --show-trace --accept-flake-config --all-systems

  convco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Conventional Commits (convco)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git merge-base --is-ancestor "${{ github.event.before }}" HEAD 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || echo origin/main)"
          fi
          nix develop .#convco --command convco check --ignore-reverts "$BASE..HEAD"
