name: Nix Flake Check

on:
  push:
    branches: [ "main", "feat/*", "fix/*", "refactor/*", "docs/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: cachix/cachix-action@v15
        with:
          name: niri # Speeds up Niri caching
          skipPush: true

      - name: Check Nix Flake
        run: nix flake check --show-trace --accept-flake-config --all-systems

  # Job that also runs devenv's git-hooks (nixfmt / statix / convco) in CI.
  # Enforce the commit-message convention and nix formatting/static analysis
  # in CI instead of relying only on local pre-commit.
  devenv-git-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full history so convco can validate the branch commits
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: cachix/cachix-action@v15
        with:
          name: niri # Speeds up Niri caching
          skipPush: true

      - name: Install devenv
        run: nix profile install 'github:NixOS/nixpkgs/nixos-unstable#devenv'

      - name: Run devenv git-hooks and tests
        # devenv test is the CI command renamed from `devenv ci` in devenv 1.0.
        # The task mechanism runs `devenv:git-hooks:run` (nixfmt / statix across
        # all files) first, then enterTest.
        run: devenv test

      - name: Check Conventional Commits (convco)
        # The convco hook lives on the commit-msg stage, so `prek run -a` does
        # not execute it. CI does not create commits, so validate the commits
        # on the branch directly with `convco check <base>..HEAD`.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="origin/main"
          fi
          devenv shell -- convco check "$BASE..HEAD"
