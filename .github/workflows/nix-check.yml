name: Nix Flake Check

on:
  push:
    branches: [ "main", "feat/*", "fix/*", "refactor/*", "docs/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: cachix/cachix-action@master
        with:
          name: niri
          skipPush: true

      - name: Check Nix Flake
        run: nix flake check --show-trace --accept-flake-config --all-systems

  convco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Conventional Commits (convco)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git merge-base --is-ancestor "${{ github.event.before }}" HEAD 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || echo origin/main)"
          fi
          nix develop .#convco --command convco check "$BASE..HEAD"
