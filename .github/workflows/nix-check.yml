name: Nix Flake Check

on:
  push:
    branches: [ "main", "feat/*", "fix/*", "refactor/*", "docs/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: cachix/cachix-action@v15
        with:
          name: niri # Speeds up Niri caching
          skipPush: true

      - name: Check Nix Flake
        run: nix flake check --show-trace --accept-flake-config --all-systems

  # Validate Conventional Commits on the branch. Formatting and static analysis
  # (nixfmt / statix) are enforced by git-hooks.nix via `checks.pre-commit`,
  # which runs as part of `nix flake check` in the job above.
  convco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full history so convco can validate the branch commits
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Conventional Commits (convco)
        # The convco hook lives on the commit-msg stage, so `pre-commit run`
        # does not execute it. CI does not create commits, so validate the
        # commits on the branch directly with `convco check <base>..HEAD`.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="origin/main"
          fi
          nix develop .#default --command convco check "$BASE..HEAD"
