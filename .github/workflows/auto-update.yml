name: Scheduled Auto Update

on:
  schedule:
    - cron: '0 19 * * *' # 04:00 JST
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/auto-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy key for the private flake input
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.NIX_CONFIG_PRIVATE_DEPLOY_KEY }}" > ~/.ssh/nix-config-private
          chmod 600 ~/.ssh/nix-config-private
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCONF'
          Host github-nix-config-private
            HostName github.com
            User git
            IdentityFile ~/.ssh/nix-config-private
            IdentitiesOnly yes
          SSHCONF

      - name: Run nvfetcher
        run: |
          nix run nixpkgs#nvfetcher

      - name: Nix Flake Update
        run: nix flake update

      - name: Validate Changes
        run: nix flake check --show-trace --accept-flake-config --all-systems

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: "chore(auto): update system and plugins"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: main
